<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Simulador de Facturación y Colaboradores</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 900px;
        margin: 20px auto;
        padding: 0 10px;
      }
      h1 {
        color: #333;
      }
      form {
        border: 1px solid #ccc;
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 20px;
      }
      label {
        font-weight: bold;
      }
      input[type="number"],
      input[type="file"] {
        width: 250px;
        max-width: 100%;
      }
      button {
        margin-top: 10px;
        padding: 8px 16px;
        border: none;
        border-radius: 4px;
        background-color: #1976d2;
        color: #fff;
        font-size: 14px;
        cursor: pointer;
      }
      button:hover {
        background-color: #145ca2;
      }
    </style>
  </head>
  <body>
    <h1>Simulación de Proyección</h1>
    <p>
      Sube tu archivo CSV con el histórico y ajusta los parámetros para estimar
      facturación y colaboradores.
    </p>

    <!-- OJO: ahora action="/simulation" -->
    <form action="/simulation" method="post" enctype="multipart/form-data">
      <p>
        <label>Archivo CSV:</label><br />
        <input type="file" name="file" accept=".csv" required />
      </p>

      <p>
        <label>Año proyección:</label><br />
        <input type="number" name="anio_proyeccion" value="2026" />
        </p>

        <p>
        <label>Crecimiento facturas (ej. 0.05 = 5%):</label><br />
        <input
            type="number"
            step="0.01"
            name="crecimiento_facturas"
            value="0.05"
        />
        </p>

        <p>
        <label>Crecimiento facturación (ej. 0.03 = 3%):</label><br />
        <input
            type="number"
            step="0.01"
            name="crecimiento_facturacion"
            value="0.03"
        />
        </p>

        <p>
        <label>Porcentaje Interno (ej. 0.92 = 92%):</label><br />
        <input type="number" step="0.01" name="p_interno" value="0.92" />
        </p>

        <p>
        <label>Porcentaje Externo (ej. 0.08 = 8%):</label><br />
        <input type="number" step="0.01" name="p_externo" value="0.08" />
        </p>

        <p>
        <label>Horas diarias por colaborador:</label><br />
        <input
            type="number"
            step="0.1"
            name="horas_diarias_por_colaborador"
            value="8"
        />
        </p>

        <p>
        <label>Días laborales por mes:</label><br />
        <input type="number" name="dias_laborales_mes" value="20" />
        </p>


      <button type="submit">Simular</button>
    </form>

    <p>
      También puedes usar la interfaz de la API en
      <a href="/docs" target="_blank">/docs</a>.
    </p>
  </body>
</html>
