<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Simulador de Capacidad Operativa</title>

    <!-- BOOTSTRAP CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />

    <!-- TU CSS -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', path='styles/main.css') }}"
    />
  </head>

  <body>
    {% set current_path = request.url.path %}

    <!-- HEADER COMPLETO: LOGO-IZQ + TÍTULO + LOGO-DER + NAV-BAR -->
    <header class="app-header">
      <div class="container py-3">
        <div
          class="d-flex justify-content-between align-items-center header-row"
        >
          <!-- Logo 1 (izquierda) -->
          <div class="header-logo-left">
            <img
              src="{{ url_for('static', path='images/logo.png') }}"
              alt="Logo 1"
              class="app-logo"
            />
          </div>

          <!-- Título y subtítulo centrados -->
          <div class="flex-grow-1 app-title-box">
            <h1>Simulador de Capacidad Operativa</h1>
            <p class="text-muted">
              Cálculo automático del personal requerido basado en datos de
              facturación histórica.
            </p>
          </div>

          <!-- Logo 2 (derecha) -->
          <div class="header-logo-right">
            <img
              src="{{ url_for('static', path='images/logoUdea.png') }}"
              alt="Logo 2"
              class="app-logo"
            />
          </div>
        </div>
      </div>

      <!-- NAV-BAR PEGADA ABAJO DEL BLOQUE DE LOGOS -->
      <nav class="navbar navbar-expand-lg navbar-dark bg-dark app-nav-bar">
        <div class="container">
          <!-- Botón hamburguesa (móvil) -->
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#mainNavbar"
            aria-controls="mainNavbar"
            aria-expanded="false"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>

          <!-- Links centrados -->
          <div class="collapse navbar-collapse justify-content-center" id="mainNavbar">
            <ul class="navbar-nav">
              <li class="nav-item">
                <a
                  class="nav-link {% if current_path == '/' %}active{% endif %}"
                  href="/"
                >
                  Inicio
                </a>
              </li>
              <li class="nav-item">
                <a
                  class="nav-link {% if current_path.startswith('/generador') %}active{% endif %}"
                  href="/generador"
                >
                  Generador de datos
                </a>
              </li>
              <li class="nav-item">
                <a
                  class="nav-link {% if current_path.startswith('/form') or current_path.startswith('/simulation') %}active{% endif %}"
                  href="/form"
                >
                  Simulación
                </a>
              </li>
            </ul>
          </div>
        </div>
      </nav>

    </header>
